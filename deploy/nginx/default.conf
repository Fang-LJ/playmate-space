server {
    listen 80;
    server_name _;

    client_max_body_size 6m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://playmate-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Only the S3 API is proxied. The MinIO Console remains private to Docker.
    # The internal Host value keeps existing MinIO presigned URLs valid after
    # MinioFileStorageService rewrites their public origin to /minio/.
    location /minio/ {
        proxy_pass http://playmate-minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host playmate-minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
