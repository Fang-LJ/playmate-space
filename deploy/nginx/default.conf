server {
    listen 80;
    listen [::]:80;
    server_name api.playmatespace.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.playmatespace.cloud;

    client_max_body_size 6m;

    ssl_certificate /etc/letsencrypt/live/api.playmatespace.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.playmatespace.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://playmate-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Only the S3 API is proxied. The MinIO Console remains private to Docker.
    # The internal Host value keeps presigned URLs valid after their public
    # origin is rewritten to this HTTPS /minio/ endpoint.
    location /minio/ {
        proxy_pass http://playmate-minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host playmate-minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
